# ─────────────────────────────────────────────────────────────
# PharmaCare — VirtualHost Apache 2.4 isolé (exemple production)
# ─────────────────────────────────────────────────────────────
# Adapter : ServerName, chemins SSL, DocumentRoot, user/group PHP-FPM.
# À placer dans /etc/apache2/sites-available/pharmacare.conf
# puis : a2ensite pharmacare && systemctl reload apache2
#
# IMPORTANT : pharmacare DOIT avoir son propre DocumentRoot dédié
# (ne pas le servir depuis le htdocs partagé qui contient d'autres
# projets : medicore, app, atlasprime, pharmacare_backup_cart…).
# ─────────────────────────────────────────────────────────────

# Redirection HTTP → HTTPS
<VirtualHost *:80>
    ServerName pharmacare.exemple.cm
    Redirect permanent / https://pharmacare.exemple.cm/
</VirtualHost>

# Site HTTPS
<VirtualHost *:443>
    ServerName pharmacare.exemple.cm
    DocumentRoot /var/www/pharmacare

    # ── TLS ──
    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/pharmacare.exemple.cm/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/pharmacare.exemple.cm/privkey.pem
    SSLProtocol             all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite          HIGH:!aNULL:!MD5

    # ── Environnement production pour l'app PHP ──
    SetEnv PHARMACARE_ENV prod

    # ── Durcissement PHP (niveau serveur, ne pas dépendre uniquement de l'app) ──
    php_admin_value display_errors Off
    php_admin_value display_startup_errors Off
    php_admin_value log_errors On
    php_admin_value error_log /var/log/pharmacare/php_errors.log
    php_admin_value session.use_strict_mode 1
    php_admin_value session.cookie_httponly 1
    php_admin_value session.cookie_samesite Lax

    # ── Sécurité répertoires ──
    <Directory /var/www/pharmacare>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # ── Empêcher l'accès direct aux dossiers non web (double sécurité avec .htaccess) ──
    <DirectoryMatch "^/var/www/pharmacare/(config|sql|tests|deploy|assets/fonts)/">
        Require all denied
    </DirectoryMatch>

    # ── Log dédié ──
    ErrorLog  /var/log/pharmacare/error.log
    CustomLog /var/log/pharmacare/access.log combined

    # ── Headers de sécurité (complément du .htaccess) ──
    <IfModule mod_headers.c>
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
        Header always set X-Frame-Options "DENY"
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </IfModule>
</VirtualHost>