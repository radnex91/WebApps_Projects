<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D9488"/>
      <stop offset="100%" style="stop-color:#14B8A6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0D9488" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Rounded square background -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- Inner glow ring -->
  <rect x="44" y="44" width="424" height="424" rx="80" fill="none" stroke="white" stroke-opacity="0.15" stroke-width="2"/>
  <!-- Pharmacy cross -->
  <rect x="194" y="124" width="124" height="264" rx="24" fill="white"/>
  <rect x="124" y="194" width="264" height="124" rx="24" fill="white"/>
  <!-- Small dot accents -->
  <circle cx="100" cy="100" r="8" fill="white" fill-opacity="0.3"/>
  <circle cx="412" cy="412" r="8" fill="white" fill-opacity="0.3"/>
</svg>